
<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- Favicon trên trình duyệt -->
    <link rel="icon" type="image/png" sizes="48x48" href="./favicon-48.png" />
    
    <!-- Logo khi thêm vào màn hình chính iPhone/iPad -->
    <link rel="apple-touch-icon" sizes="180x180" href="./icon-apple-180.png" />
    
    <!-- PWA -->
    <link rel="manifest" href="./manifest.json" />

    <title>FoodRadar - Khám phá quán ăn</title>

    <!-- Khởi tạo chế độ sáng/tối trước khi render để tránh nháy giao diện (FOUC) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('foodradar-theme');
          var theme =
            saved === 'dark' || saved === 'light'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              'content',
              theme === 'dark' ? '#0b1320' : '#ffffff'
            );
          }
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
